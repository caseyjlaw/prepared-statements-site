<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Huntington and Fremont are for Everyone — Email South Pasadena City Council</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-layer" aria-hidden="true">
      <img class="bg-hero" src="assets/hero-left.png" alt="" />
      <img class="bg-logo" src="assets/logo.png" alt="" />
    </div>

    <div class="wrap">
      <header class="advocacy-header">
        <h1 id="advocacy-headline" class="advocacy-hero"></h1>
        <p id="advocacy-intro" class="advocacy-intro"></p>
      </header>

      <main class="workflow">
        <section class="step-card" aria-labelledby="step-1-label">
          <h2 id="step-1-label" class="step-title">
            <span class="step-number">1</span> Select a message template
          </h2>
          <div
            id="template-picker"
            class="template-picker"
            role="listbox"
            aria-labelledby="step-1-label"
            hidden
          ></div>
          <p id="selected-template-label" class="field-hint step-selection-hint" hidden></p>
        </section>

        <section class="step-card" aria-labelledby="step-2-label">
          <h2 id="step-2-label" class="step-title">
            <span class="step-number">2</span> Customize your draft
          </h2>
          <div class="draft-fields">
            <div class="field">
              <label for="email-subject">Subject line</label>
              <input
                id="email-subject"
                name="email-subject"
                type="text"
                autocomplete="off"
                placeholder="Select a template above, then edit the subject if you like."
              />
            </div>
            <div class="field field-last">
              <label for="message">Your draft message (customize and add your name)</label>
              <textarea
                id="message"
                name="message"
                rows="10"
                spellcheck="true"
                placeholder="Your selected template will appear here."
              ></textarea>
            </div>
          </div>
        </section>

        <section class="step-card step-card-send" aria-labelledby="step-3-label">
          <h2 id="step-3-label" class="step-title">
            <span class="step-number">3</span> Send with your email client
          </h2>
          <div class="actions">
            <button type="button" id="compose" class="btn-send">
              <span class="btn-send-main">Send email</span>
            </button>
          </div>
        </section>

        <p id="status" role="status"></p>
      </main>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
