<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Huntington and Fremont are for Everyone — Email South Pasadena City Council</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="advocacy-header">
        <div class="brand-bar">
          <img
            class="brand-logo"
            src="assets/logo.png"
            alt="South Pas Active"
            width="330"
            height="236"
          />
        </div>
        <div class="hero-layout">
          <img
            class="hero-photo"
            src="assets/hero-left.png"
            alt="Community bike bus with kids, families, and a Come Join Bike Bus sign"
            width="703"
            height="476"
          />
          <div class="hero-copy">
            <h1 id="advocacy-headline" class="advocacy-hero"></h1>
            <p id="advocacy-intro" class="advocacy-intro"></p>
          </div>
        </div>
      </header>

      <main class="workflow">
        <section class="step-card" aria-labelledby="step-1-label">
          <div class="step-heading">
            <span class="step-number" aria-hidden="true">1</span>
            <h2 id="step-1-label" class="step-title">Select a message template</h2>
          </div>
          <div
            id="template-picker"
            class="template-picker"
            role="listbox"
            aria-labelledby="step-1-label"
            hidden
          ></div>
          <p id="selected-template-label" class="field-hint step-selection-hint" hidden></p>
        </section>

        <section class="step-card" aria-labelledby="step-2-label">
          <div class="step-heading">
            <span class="step-number" aria-hidden="true">2</span>
            <h2 id="step-2-label" class="step-title">Click to load</h2>
          </div>
          <button type="button" id="load-template" class="btn-load" disabled>
            Load selected template into draft
          </button>
          <div class="draft-fields">
            <div class="field">
              <label for="email-subject">Subject line</label>
              <input
                id="email-subject"
                name="email-subject"
                type="text"
                autocomplete="off"
                placeholder="Load a template, then edit the subject if you like."
              />
            </div>
            <div class="field field-last">
              <label for="message">Your draft message (customize and add your name)</label>
              <textarea
                id="message"
                name="message"
                rows="10"
                spellcheck="true"
                placeholder="Your loaded template will appear here."
              ></textarea>
            </div>
          </div>
        </section>

        <section class="step-card step-card-send" aria-labelledby="step-3-label">
          <div class="step-heading">
            <span class="step-number" aria-hidden="true">3</span>
            <h2 id="step-3-label" class="step-title">Send with your email client</h2>
          </div>
          <div class="actions">
            <button type="button" id="compose" class="btn-send">
              <span class="btn-send-main">Send email</span>
              <span class="btn-send-note">Opens your mail app with this message ready to send</span>
            </button>
          </div>
        </section>

        <p id="status" role="status"></p>
      </main>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
